<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <!-- Outer Chrome Metallic Gradient -->
    <linearGradient id="chromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#d1d5db"/>
      <stop offset="35%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#f3f4f6"/>
      <stop offset="65%" stop-color="#6b7280"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Inner Chrome Bevel Gradient -->
    <linearGradient id="chromeInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <!-- Deep Candy Red Plate Gradient -->
    <linearGradient id="redPlate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c92a2a"/>
      <stop offset="25%" stop-color="#b01b1b"/>
      <stop offset="65%" stop-color="#8a0f0f"/>
      <stop offset="100%" stop-color="#540707"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 3D Letter Shadow -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3b0000" flood-opacity="0.8"/>
    </filter>

    <!-- Sparkle Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffdddd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Group with Drop Shadow -->
  <g filter="url(#badgeShadow)">
    <!-- 1. Outer Chrome Border Rim (Rounded Hexagon) -->
    <path d="M 300 16 
             L 570 78 
             A 10 10 0 0 1 576 86 
             L 576 214 
             A 10 10 0 0 1 570 222 
             L 300 284 
             A 8 8 0 0 1 296 284 
             L 26 222 
             A 10 10 0 0 1 20 214 
             L 20 86 
             A 10 10 0 0 1 26 78 
             L 296 16 
             A 8 8 0 0 1 300 16 Z" 
          fill="url(#chromeOuter)" 
          stroke="#374151" 
          stroke-width="1.5"/>

    <!-- 2. Mid Chrome Bevel Edge -->
    <path d="M 300 23 
             L 561 83 
             A 8 8 0 0 1 566 90 
             L 566 210 
             A 8 8 0 0 1 561 217 
             L 300 277 
             A 7 7 0 0 1 297 277 
             L 35 217 
             A 8 8 0 0 1 30 210 
             L 30 90 
             A 8 8 0 0 1 35 83 
             L 297 23 
             A 7 7 0 0 1 300 23 Z" 
          fill="url(#chromeInner)"/>

    <!-- 3. Inner Dark Groove -->
    <path d="M 300 28 
             L 553 87 
             A 6 6 0 0 1 557 93 
             L 557 207 
             A 6 6 0 0 1 553 213 
             L 300 272 
             A 6 6 0 0 1 297 272 
             L 43 213 
             A 6 6 0 0 1 39 207 
             L 39 93 
             A 6 6 0 0 1 43 87 
             L 297 28 
             A 6 6 0 0 1 300 28 Z" 
          fill="#2b0000" 
          stroke="#1a1a1a" 
          stroke-width="1"/>

    <!-- 4. Deep Red Core Plate -->
    <path d="M 300 31 
             L 550 89 
             L 554 206 
             L 300 269 
             L 42 206 
             L 46 89 Z" 
          fill="url(#redPlate)"/>

    <!-- 5. Top Specular Gloss Arc -->
    <path d="M 300 31 
             L 550 89 
             L 552 145 
             Q 300 175 44 145 
             L 46 89 Z" 
          fill="url(#glossGrad)"/>

    <!-- 6. Bottom Reflection Edge -->
    <path d="M 46 204 L 300 266 L 550 204" 
          fill="none" 
          stroke="#ff6b6b" 
          stroke-width="1.2" 
          opacity="0.35"/>
  </g>

  <!-- 7. Typography: TECHNO (3D Extruded) -->
  <!-- 3D Lower Extrusion Shadow -->
  <text x="300" y="169" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="2"
        fill="#260303">
    TECHNO
  </text>
  <!-- 3D Mid Metallic Bevel Extrusion -->
  <text x="300" y="166" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="2"
        fill="#b0bec5">
    TECHNO
  </text>
  <text x="300" y="164" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="2"
        fill="#cfd8dc">
    TECHNO
  </text>
  <!-- Face White Crisp Text -->
  <text x="300" y="162" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="2"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="1.5">
    TECHNO
  </text>

  <!-- 8. Typography: OTOPARTS -->
  <!-- Soft Shadow -->
  <text x="300" y="228" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="12"
        fill="#1e0202">
    OTOPARTS
  </text>
  <!-- Face White -->
  <text x="300" y="226" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="12"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="0.8">
    OTOPARTS
  </text>

  <!-- 9. Sparkle Flare on Top Right of 'O' in TECHNO -->
  <!-- Approximate position of 'O' top-right corner: x=496, y=88 -->
  <g transform="translate(497, 88)">
    <!-- Radial Soft Glow -->
    <circle cx="0" cy="0" r="16" fill="url(#sparkleGlow)"/>
    <!-- Horizontal Flare Ray -->
    <polygon points="-26,0 0,-1.5 26,0 0,1.5" fill="#ffffff"/>
    <!-- Vertical Flare Ray -->
    <polygon points="0,-26 -1.5,0 0,26 1.5,0" fill="#ffffff"/>
    <!-- Diagonal Subtle Rays -->
    <polygon points="-12,-12 0,-0.8 12,12 0,0.8" fill="#ffffff" opacity="0.8"/>
    <polygon points="12,-12 0.8,0 -12,12 -0.8,0" fill="#ffffff" opacity="0.8"/>
    <!-- Core Bright Dot -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
